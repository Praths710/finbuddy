# Render's free plan puts the API to sleep after ~15 minutes without traffic,
# which makes the next visitor wait 30-60 s. Pinging it every 10 minutes keeps
# it awake (one always-on service fits within Render's 750 free hours/month).
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          curl --silent --show-error --fail --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://finbuddy-api-python.onrender.com/health
